name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: typecheck, build, CLI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - name: typecheck
        run: npm run typecheck
      - name: unit tests (no sandbox required, so these run in CI)
        run: npm run test:unit
      - name: build (plain JS into dist/, for consumers who want it)
        run: npm run build
      - name: CLI smoke test
        run: |
          ./cmd/main.ts version
          ./cmd/main.ts --help
          node dist/cmd/main.js version
      - name: host capability probe (must not crash on a host without namespaces)
        run: ./cmd/main.ts doctor --json || true

  sandbox:
    name: sandbox end-to-end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor,
      # which is the one kernel feature moat cannot work without. GitHub runners
      # have passwordless sudo, so lift the restriction and then check whether
      # namespaces actually work rather than assuming the sysctl was enough.
      - name: lift the AppArmor restriction on user namespaces (24.04+)
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
        continue-on-error: true
      - name: can this runner create unprivileged user namespaces?
        id: userns
        run: |
          # Diagnose rather than guess: print the kernel state and the real error
          # from unshare, so a reader can see why the sandbox suite cannot run.
          echo "max_user_namespaces: $(cat /proc/sys/user/max_user_namespaces 2>/dev/null || echo n/a)"
          echo "apparmor_restrict:   $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo n/a)"
          echo "inside a container:  $( [ -e /.dockerenv ] && echo yes || echo no )"
          echo "--- unshare --user --map-root-user --mount (full output) ---"
          unshare --user --map-root-user --mount sh -c 'mount -t tmpfs none /tmp/.probe && echo PROBE_OK' || true
          echo "---"
          if unshare --user --map-root-user --mount sh -c 'mount -t tmpfs none /tmp/.probe' 2>/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "user namespaces: available, running the full suite"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Sandbox suite skipped::This runner cannot create unprivileged user namespaces, which moat requires and will not work around. The build, CLI and catalog checks above still ran; run 'bash test/e2e.sh' on a real machine for the sandbox suite."
          fi
      - name: list the toolchain profiles
        run: ./cmd/main.ts profiles
      - name: model catalog (network)
        run: ./cmd/main.ts models deepseek
      - name: full acceptance suite
        if: steps.userns.outputs.available == 'true'
        run: bash test/e2e.sh
      - name: secondary suite (snapshots, apply, credential expiry)
        if: steps.userns.outputs.available == 'true'
        run: bash test/e2e-extras.sh
      - name: upload evidence
        if: always() && steps.userns.outputs.available == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: evidence
          path: test/evidence/
          if-no-files-found: warn
